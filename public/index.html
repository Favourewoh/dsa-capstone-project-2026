<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events — Event Ticketing</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" class="brand">Ticketing</a>
      <nav aria-label="Primary">
        <a href="/index.html" class="nav-link active">Browse Events</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-head">
      <h1>Upcoming Events</h1>
      <p class="muted">Search, filter by city or maximum price, and sort available tickets.</p>
    </section>

    <section aria-label="Filter events" class="filters-panel">
      <form id="filters-form" class="filters-grid">
        <div class="field">
          <label for="search-input">Search</label>
          <input id="search-input" name="q" type="search" placeholder="Event title, venue, or city" />
        </div>

        <div class="field">
          <label for="city-select">City</label>
          <select id="city-select" name="city">
            <option value="">All cities</option>
          </select>
        </div>

        <div class="field">
          <label for="max-price-input">Max price (₦)</label>
          <input id="max-price-input" name="maxPriceNaira" type="number" min="0" step="1" placeholder="Any" />
        </div>

        <div class="field">
          <label for="sort-select">Sort by</label>
          <select id="sort-select" name="sortBy">
            <option value="date">Date (soonest)</option>
            <option value="price">Price (lowest)</option>
            <option value="title">Title (A–Z)</option>
          </select>
        </div>

        <div class="field field-actions">
          <button type="submit" class="btn btn-primary">Apply</button>
          <button type="button" id="reset-filters-btn" class="btn btn-secondary">Reset</button>
        </div>
      </form>
    </section>

    <section aria-live="polite" class="results-meta">
      <p id="results-count" class="muted"></p>
    </section>

    <section id="events-list" class="events-grid" aria-label="Events list"></section>
  </main>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
